<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1500" width="1080" height="1500"><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',sans-serif;}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E6E5F"/></marker><marker id="arT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4562F"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5E7A80"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A6FA5"/></marker><marker id="arGd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C9A063"/></marker></defs><rect x="0" y="0" width="1080" height="1500" rx="0" fill="#F7F8F6"/><rect x="46" y="42" width="139" height="25" rx="12.5" fill="#0A4A41" stroke="#D9E1DD" stroke-width="1.4"/><text x="116" y="59" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">医美技术栈 · 图 01</text><text x="540" y="84" font-size="33" fill="#22424A" font-weight="700" text-anchor="middle">美容医生的技术栈，七层全景</text><text x="540" y="118" font-size="16.5" fill="#5E7A80" font-weight="400" text-anchor="middle">对标 IT 工程师 · 栈顶在上，准入为底，持续学习贯穿全栈</text><line x1="46" y1="140" x2="1034" y2="140" stroke="#D9E1DD" stroke-width="1.2"/><text x="46" y="1476" font-size="12.5" fill="#5E7A80" font-weight="400" text-anchor="start">医美技术栈系列 · B 端</text><text x="1034" y="1476" font-size="12.5" fill="#5E7A80" font-weight="400" text-anchor="end">事实核验 2026-08-18</text><rect x="64" y="168" width="880" height="150" rx="14" fill="#0A4A41" stroke="#D9E1DD" stroke-width="1.4"/><text x="98" y="220" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="start">L7 审美沟通层</text><text x="98" y="256" font-size="15" fill="#F2F8F6" font-weight="400" text-anchor="start">动态审美判断，概率语言沟通，预期管理</text><text x="98" y="283" font-size="15" fill="#F2F8F6" font-weight="400" text-anchor="start">与咨询师的协作接口</text><rect x="848" y="192" width="74" height="30" rx="15" fill="#FFFFFF" stroke="#D9E1DD" stroke-width="1.4" fill-opacity="0.92"/><text x="885" y="212" font-size="12.5" fill="#0A4A41" font-weight="600" text-anchor="middle">产品思维</text><rect x="64" y="332" width="880" height="150" rx="14" fill="#0E6E5F" stroke="#D9E1DD" stroke-width="1.4"/><rect x="64" y="332" width="10" height="150" rx="5" fill="#C9A063"/><text x="98" y="384" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="start">L6 规范安全层</text><text x="98" y="420" font-size="15" fill="#F2F8F6" font-weight="400" text-anchor="start">适应症与禁忌筛查，知情同意与病历</text><text x="98" y="447" font-size="15" fill="#F2F8F6" font-weight="400" text-anchor="start">并发症处置预案，感控与急救配置</text><rect x="798" y="356" width="124" height="30" rx="15" fill="#FFFFFF" stroke="#D9E1DD" stroke-width="1.4" fill-opacity="0.92"/><text x="860" y="376" font-size="12.5" fill="#0A4A41" font-weight="600" text-anchor="middle">工程规范（加厚）</text><text x="786" y="376" font-size="12.5" fill="#C9A063" font-weight="700" text-anchor="end">医疗特有</text><rect x="64" y="496" width="880" height="150" rx="14" fill="#2E8A79" stroke="#D9E1DD" stroke-width="1.4"/><text x="98" y="548" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="start">L5 评估层</text><text x="98" y="584" font-size="15" fill="#F2F8F6" font-weight="400" text-anchor="start">皮肤分型，皮肤镜与影像分析</text><text x="98" y="611" font-size="15" fill="#F2F8F6" font-weight="400" text-anchor="start">主诉需求轴评估，面部美学评估</text><rect x="810" y="520" width="112" height="30" rx="15" fill="#FFFFFF" stroke="#D9E1DD" stroke-width="1.4" fill-opacity="0.92"/><text x="866" y="540" font-size="12.5" fill="#0A4A41" font-weight="600" text-anchor="middle">调试与测试工具</text><rect x="64" y="660" width="880" height="150" rx="14" fill="#5FA292" stroke="#D9E1DD" stroke-width="1.4"/><text x="98" y="712" font-size="22" fill="#FFFFFF" font-weight="700" text-anchor="start">L4 材料层</text><text x="98" y="748" font-size="15" fill="#F2F8F6" font-weight="400" text-anchor="start">肉毒毒素剂量学，透明质酸特性与层次</text><text x="98" y="775" font-size="15" fill="#F2F8F6" font-weight="400" text-anchor="start">胶原与再生材料，外用口服药物证据</text><rect x="836" y="684" width="86" height="30" rx="15" fill="#FFFFFF" stroke="#D9E1DD" stroke-width="1.4" fill-opacity="0.92"/><text x="879" y="704" font-size="12.5" fill="#0A4A41" font-weight="600" text-anchor="middle">数据与存储</text><rect x="64" y="824" width="880" height="150" rx="14" fill="#93C2B6" stroke="#D9E1DD" stroke-width="1.4"/><text x="98" y="876" font-size="22" fill="#0A4A41" font-weight="700" text-anchor="start">L3 设备层</text><text x="98" y="912" font-size="15" fill="#2A5A50" font-weight="400" text-anchor="start">波长脉宽光斑密度的参数思维</text><text x="98" y="939" font-size="15" fill="#2A5A50" font-weight="400" text-anchor="start">光电声设备品类，注册类别意识</text><rect x="848" y="848" width="74" height="30" rx="15" fill="#FFFFFF" stroke="#D9E1DD" stroke-width="1.4"/><text x="885" y="868" font-size="12.5" fill="#0A4A41" font-weight="600" text-anchor="middle">框架与库</text><rect x="64" y="988" width="880" height="150" rx="14" fill="#C6E0D8" stroke="#D9E1DD" stroke-width="1.4"/><text x="98" y="1040" font-size="22" fill="#0A4A41" font-weight="700" text-anchor="start">L2 底层语言层</text><text x="98" y="1076" font-size="15" fill="#2A5A50" font-weight="400" text-anchor="start">面部解剖，血管地图，脂肪室与韧带</text><text x="98" y="1103" font-size="15" fill="#2A5A50" font-weight="400" text-anchor="start">皮肤生理，色素病理，药理</text><rect x="848" y="1012" width="74" height="30" rx="15" fill="#FFFFFF" stroke="#D9E1DD" stroke-width="1.4"/><text x="885" y="1032" font-size="12.5" fill="#0A4A41" font-weight="600" text-anchor="middle">编程语言</text><rect x="64" y="1152" width="880" height="150" rx="14" fill="#E7F2EE" stroke="#D9E1DD" stroke-width="1.4"/><text x="98" y="1204" font-size="22" fill="#0A4A41" font-weight="700" text-anchor="start">L1 准入层</text><text x="98" y="1240" font-size="15" fill="#2A5A50" font-weight="400" text-anchor="start">执业医师资格与注册，主诊医师备案</text><text x="98" y="1267" font-size="15" fill="#2A5A50" font-weight="400" text-anchor="start">美容外科六年以上，皮肤科等三年以上经历</text><rect x="848" y="1176" width="74" height="30" rx="15" fill="#FFFFFF" stroke="#D9E1DD" stroke-width="1.4"/><text x="885" y="1196" font-size="12.5" fill="#0A4A41" font-weight="600" text-anchor="middle">上岗认证</text><line x1="1000" y1="1296" x2="1000" y2="180" stroke="#5E7A80" stroke-width="2.2" marker-end="url(#arG)"/><line x1="986" y1="1296" x2="986" y2="180" stroke="#D9E1DD" stroke-width="1.2" stroke-dasharray="3 5"/><text x="1000" y="206" font-size="13" fill="#5E7A80" font-weight="600" text-anchor="end">持续学习</text><text x="1000" y="226" font-size="13" fill="#5E7A80" font-weight="600" text-anchor="end">版本升级</text><rect x="64" y="1322" width="940" height="96" rx="14" fill="#FFFFFF" stroke="#D9E1DD" stroke-width="1.4"/><text x="90" y="1354" font-size="16" fill="#22424A" font-weight="700" text-anchor="start">底部的两层是硬门槛</text><text x="90" y="1380" font-size="13.5" fill="#5E7A80" font-weight="400" text-anchor="start">准入依据《医疗美容服务管理办法》（卫生部令第 19 号，2022 年修订），多数省份限备案一个专业类别。</text><text x="90" y="1404" font-size="13.5" fill="#5E7A80" font-weight="400" text-anchor="start">语言层决定上限，血管地图不清，后面的设备与材料全都无处安放。</text></svg>