<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660" width="1080" height="660"><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',sans-serif;}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E6E5F"/></marker><marker id="arT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4562F"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5E7A80"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A6FA5"/></marker><marker id="arGd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C9A063"/></marker></defs><rect x="0" y="0" width="1080" height="660" rx="0" fill="#F7F8F6"/><rect x="46" y="42" width="139" height="25" rx="12.5" fill="#0A4A41" stroke="#D9E1DD" stroke-width="1.4"/><text x="116" y="59" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">医美技术栈 · 图 04</text><text x="540" y="84" font-size="33" fill="#22424A" font-weight="700" text-anchor="middle">围治疗期，医生的运维时间轴</text><text x="540" y="118" font-size="16.5" fill="#5E7A80" font-weight="400" text-anchor="middle">价值的一半在治疗之外，术前、术中、术后、随访各有节点</text><line x1="46" y1="140" x2="1034" y2="140" stroke="#D9E1DD" stroke-width="1.2"/><text x="46" y="636" font-size="12.5" fill="#5E7A80" font-weight="400" text-anchor="start">医美技术栈系列 · B 端</text><text x="1034" y="636" font-size="12.5" fill="#5E7A80" font-weight="400" text-anchor="end">事实核验 2026-08-18</text><line x1="100" y1="250" x2="980" y2="250" stroke="#D9E1DD" stroke-width="2.4"/><circle cx="130" cy="250" r="9" fill="#0E6E5F"/><circle cx="130" cy="250" r="4" fill="#FFFFFF"/><text x="130" y="210" font-size="19" fill="#22424A" font-weight="700" text-anchor="middle">术前</text><text x="130" y="290" font-size="13.5" fill="#5E7A80" font-weight="400" text-anchor="middle">筛查清单</text><text x="130" y="315" font-size="13.5" fill="#5E7A80" font-weight="400" text-anchor="middle">基线影像</text><text x="130" y="340" font-size="13.5" fill="#5E7A80" font-weight="400" text-anchor="middle">知情同意</text><circle cx="345" cy="250" r="9" fill="#0E6E5F"/><circle cx="345" cy="250" r="4" fill="#FFFFFF"/><text x="345" y="210" font-size="19" fill="#22424A" font-weight="700" text-anchor="middle">治疗日</text><text x="345" y="290" font-size="13.5" fill="#5E7A80" font-weight="400" text-anchor="middle">查对制度</text><text x="345" y="315" font-size="13.5" fill="#5E7A80" font-weight="400" text-anchor="middle">参数记录</text><text x="345" y="340" font-size="13.5" fill="#5E7A80" font-weight="400" text-anchor="middle">术中观察</text><circle cx="560" cy="250" r="9" fill="#0E6E5F"/><circle cx="560" cy="250" r="4" fill="#FFFFFF"/><text x="560" y="210" font-size="19" fill="#22424A" font-weight="700" text-anchor="middle">72 小时</text><text x="560" y="290" font-size="13.5" fill="#5E7A80" font-weight="400" text-anchor="middle">反应高峰期</text><text x="560" y="315" font-size="13.5" fill="#5E7A80" font-weight="400" text-anchor="middle">异常识别</text><text x="560" y="340" font-size="13.5" fill="#5E7A80" font-weight="400" text-anchor="middle">首次回访</text><circle cx="775" cy="250" r="9" fill="#0E6E5F"/><circle cx="775" cy="250" r="4" fill="#FFFFFF"/><text x="775" y="210" font-size="19" fill="#22424A" font-weight="700" text-anchor="middle">1 至 2 周</text><text x="775" y="290" font-size="13.5" fill="#5E7A80" font-weight="400" text-anchor="middle">结痂与修复</text><text x="775" y="315" font-size="13.5" fill="#5E7A80" font-weight="400" text-anchor="middle">屏障管理</text><text x="775" y="340" font-size="13.5" fill="#5E7A80" font-weight="400" text-anchor="middle">复诊节点</text><circle cx="990" cy="250" r="9" fill="#0E6E5F"/><circle cx="990" cy="250" r="4" fill="#FFFFFF"/><text x="990" y="210" font-size="19" fill="#22424A" font-weight="700" text-anchor="middle">1 至 3 月</text><text x="990" y="290" font-size="13.5" fill="#5E7A80" font-weight="400" text-anchor="middle">效果评估</text><text x="990" y="315" font-size="13.5" fill="#5E7A80" font-weight="400" text-anchor="middle">方案迭代</text><text x="990" y="340" font-size="13.5" fill="#5E7A80" font-weight="400" text-anchor="middle">长期档案</text><line x1="146" y1="250" x2="327" y2="250" stroke="#0E6E5F" stroke-width="2.4" marker-end="url(#ar)"/><line x1="361" y1="250" x2="542" y2="250" stroke="#0E6E5F" stroke-width="2.4" marker-end="url(#ar)"/><line x1="576" y1="250" x2="757" y2="250" stroke="#0E6E5F" stroke-width="2.4" marker-end="url(#ar)"/><line x1="791" y1="250" x2="972" y2="250" stroke="#0E6E5F" stroke-width="2.4" marker-end="url(#ar)"/><rect x="70" y="420" width="940" height="46" rx="10" fill="#E7F2EE" stroke="#0A4A41" stroke-width="1"/><text x="94" y="449" font-size="15.5" fill="#0A4A41" font-weight="700" text-anchor="start">预期内反应</text><text x="250" y="449" font-size="13.5" fill="#5E7A80" font-weight="400" text-anchor="start">红肿、轻微胀痛，按术后须知观察与随访</text><rect x="70" y="478" width="940" height="46" rx="10" fill="#F6EEDD" stroke="#8A6A33" stroke-width="1"/><text x="94" y="507" font-size="15.5" fill="#8A6A33" font-weight="700" text-anchor="start">需处置</text><text x="250" y="507" font-size="13.5" fill="#5E7A80" font-weight="400" text-anchor="start">持续红斑、色素异常征兆，预约面诊评估</text><rect x="70" y="536" width="940" height="46" rx="10" fill="#F9EDE5" stroke="#B4562F" stroke-width="1"/><text x="94" y="565" font-size="15.5" fill="#B4562F" font-weight="700" text-anchor="start">急症</text><text x="250" y="565" font-size="13.5" fill="#5E7A80" font-weight="400" text-anchor="start">剧烈疼痛、皮肤发白或视力症状，立即启动急救与转诊</text><text x="70" y="408" font-size="15" fill="#22424A" font-weight="600" text-anchor="start">并发症的三级分诊，处置动作随级别切换</text></svg>