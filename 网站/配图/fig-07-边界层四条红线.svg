<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 830" width="1080" height="830"><style>text{font-family:'PingFang SC','Microsoft YaHei','Noto Sans SC','Source Han Sans SC',sans-serif;}</style><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E6E5F"/></marker><marker id="arT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4562F"/></marker><marker id="arG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5E7A80"/></marker><marker id="arB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4A6FA5"/></marker><marker id="arGd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C9A063"/></marker></defs><rect x="0" y="0" width="1080" height="830" rx="0" fill="#F7F8F6"/><rect x="46" y="42" width="139" height="25" rx="12.5" fill="#0A4A41" stroke="#D9E1DD" stroke-width="1.4"/><text x="116" y="59" font-size="13" fill="#FFFFFF" font-weight="600" text-anchor="middle">医美技术栈 · 图 07</text><text x="540" y="84" font-size="33" fill="#22424A" font-weight="700" text-anchor="middle">边界层，专业性的来源</text><text x="540" y="118" font-size="16.5" fill="#5E7A80" font-weight="400" text-anchor="middle">四项医疗行为法定归属执业医师，边界不是天花板</text><line x1="46" y1="140" x2="1034" y2="140" stroke="#D9E1DD" stroke-width="1.2"/><text x="46" y="806" font-size="12.5" fill="#5E7A80" font-weight="400" text-anchor="start">医美技术栈系列 · B 端</text><text x="1034" y="806" font-size="12.5" fill="#5E7A80" font-weight="400" text-anchor="end">事实核验 2026-08-18</text><rect x="70" y="176" width="340" height="320" rx="16" fill="#FFFFFF" stroke="#0E6E5F" stroke-width="1.6"/><text x="240" y="216" font-size="19" fill="#22424A" font-weight="700" text-anchor="middle">咨询师的工作面</text><circle cx="108" cy="254" r="4" fill="#0E6E5F"/><text x="124" y="260" font-size="15" fill="#22424A" font-weight="400" text-anchor="start">主诉转译与需求归类</text><circle cx="108" cy="310" r="4" fill="#0E6E5F"/><text x="124" y="316" font-size="15" fill="#22424A" font-weight="400" text-anchor="start">流程、档案与随访</text><circle cx="108" cy="366" r="4" fill="#0E6E5F"/><text x="124" y="372" font-size="15" fill="#22424A" font-weight="400" text-anchor="start">项目知识科普与答疑</text><circle cx="108" cy="422" r="4" fill="#0E6E5F"/><text x="124" y="428" font-size="15" fill="#22424A" font-weight="400" text-anchor="start">案例与报告的规范讲解</text><rect x="510" y="216" width="59" height="40" rx="20.0" fill="#B4562F" stroke="#D9E1DD" stroke-width="1.4"/><text x="540" y="242" font-size="15.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">诊断</text><line x1="416" y1="236" x2="478" y2="236" stroke="#B4562F" stroke-width="1.8" marker-end="url(#arT)"/><rect x="510" y="282" width="59" height="40" rx="20.0" fill="#B4562F" stroke="#D9E1DD" stroke-width="1.4"/><text x="540" y="308" font-size="15.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">处方</text><line x1="416" y1="302" x2="478" y2="302" stroke="#B4562F" stroke-width="1.8" marker-end="url(#arT)"/><rect x="495" y="348" width="90" height="40" rx="20.0" fill="#B4562F" stroke="#D9E1DD" stroke-width="1.4"/><text x="540" y="374" font-size="15.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">治疗方案</text><line x1="416" y1="368" x2="478" y2="368" stroke="#B4562F" stroke-width="1.8" marker-end="url(#arT)"/><rect x="495" y="414" width="90" height="40" rx="20.0" fill="#B4562F" stroke="#D9E1DD" stroke-width="1.4"/><text x="540" y="440" font-size="15.5" fill="#FFFFFF" font-weight="600" text-anchor="middle">操作实施</text><line x1="416" y1="434" x2="478" y2="434" stroke="#B4562F" stroke-width="1.8" marker-end="url(#arT)"/><rect x="640" y="176" width="340" height="320" rx="16" fill="#F9EDE5" stroke="#B4562F" stroke-width="1.8"/><text x="810" y="220" font-size="19" fill="#B4562F" font-weight="700" text-anchor="middle">执业医师负责</text><text x="810" y="254" font-size="14" fill="#5E7A80" font-weight="400" text-anchor="middle">《医疗美容服务管理办法》确立执业医师负责制，</text><text x="810" y="280" font-size="14" fill="#5E7A80" font-weight="400" text-anchor="middle">诊断、处方、治疗方案、操作实施四项</text><text x="810" y="306" font-size="14" fill="#5E7A80" font-weight="400" text-anchor="middle">医疗行为由具备资质的医师完成。</text><text x="810" y="372" font-size="14.5" fill="#22424A" font-weight="600" text-anchor="middle">边界让咨询师成为医疗团队的协作岗</text><text x="810" y="398" font-size="14.5" fill="#22424A" font-weight="600" text-anchor="middle">而不是单兵作战的销售岗</text><rect x="70" y="532" width="940" height="96" rx="14" fill="#FFFFFF" stroke="#D9E1DD" stroke-width="1.4"/><text x="94" y="564" font-size="16" fill="#22424A" font-weight="700" text-anchor="start">转诊信号，出现即进入医生面诊流程</text><text x="94" y="592" font-size="14" fill="#5E7A80" font-weight="400" text-anchor="start">疼痛异常 · 皮肤感染迹象 · 妊娠可能或光电禁忌史 · 期望值明显偏离沟通结果 · 未成年客人（须监护人知情同意流程）</text><text x="94" y="614" font-size="13" fill="#0E6E5F" font-weight="600" text-anchor="start">转诊是接口质量，不是能力不足的标志</text><rect x="70" y="648" width="940" height="118" rx="14" fill="#F7F8F6" stroke="#D9E1DD" stroke-width="1.4"/><text x="94" y="678" font-size="15.5" fill="#22424A" font-weight="700" text-anchor="start">宣传合规的五条重点（《医疗美容广告执法指南》，市场监管总局 2021）</text><rect x="94" y="698" width="119" height="34" rx="17.0" fill="#FFFFFF" stroke="#D9E1DD" stroke-width="1.4"/><text x="154" y="720" font-size="13" fill="#0A4A41" font-weight="600" text-anchor="middle">不制造容貌焦虑</text><rect x="227" y="698" width="106" height="34" rx="17.0" fill="#FFFFFF" stroke="#D9E1DD" stroke-width="1.4"/><text x="280" y="720" font-size="13" fill="#0A4A41" font-weight="600" text-anchor="middle">不作疗效承诺</text><rect x="347" y="698" width="171" height="34" rx="17.0" fill="#FFFFFF" stroke="#D9E1DD" stroke-width="1.4"/><text x="432" y="720" font-size="13" fill="#0A4A41" font-weight="600" text-anchor="middle">不用患者形象作对比证明</text><rect x="532" y="698" width="171" height="34" rx="17.0" fill="#FFFFFF" stroke="#D9E1DD" stroke-width="1.4"/><text x="618" y="720" font-size="13" fill="#0A4A41" font-weight="600" text-anchor="middle">不用医生与专业人士代言</text><rect x="717" y="698" width="145" height="34" rx="17.0" fill="#FFFFFF" stroke="#D9E1DD" stroke-width="1.4"/><text x="790" y="720" font-size="13" fill="#0A4A41" font-weight="600" text-anchor="middle">不面向未成年人发布</text><text x="94" y="754" font-size="13" fill="#5E7A80" font-weight="400" text-anchor="start">执法指南为监管与内容创作的共同边界，正面科普空间因此更清晰</text></svg>